name: Doku-Links

# Läuft nur, wenn sich etwas ändert, was die Prüfung liest: die Doku, die
# README, die Migrationen, das Skript selbst und dieser Workflow.
on:
  push:
    branches: ["main", "freebuff/**"]
    paths:
      - "docs/**"
      - "README.md"
      - "supabase/migrations/**"
      - "scripts/check-docs-links.mjs"
      - ".github/workflows/docs-links.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "supabase/migrations/**"
      - "scripts/check-docs-links.mjs"
      - ".github/workflows/docs-links.yml"

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Relative Links in docs/ und README.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kein bun install: das Skript nutzt nur Node-Bordmittel.
      - name: Prüfen
        run: node scripts/check-docs-links.mjs
