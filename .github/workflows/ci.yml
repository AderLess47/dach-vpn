name: CI

# Ein Push startet genau einen Lauf: `main` über `push`, jeder andere Branch
# über seinen Pull Request. Stünde `freebuff/**` auch unter `push`, liefe jeder
# Commit doppelt — einmal auf `refs/heads/…`, einmal auf `refs/pull/N/merge` —
# und `concurrency` könnte das nicht verhindern, weil die Refs verschieden
# sind. Ohne PR läuft auf einem Branch also nichts; die Gegenprobe per Mutation
# braucht deshalb einen Draft-PR.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Dokument-Zahlen (README und docs/testing.md)
        # Reiner Vergleich der Zahlen in beiden Dokumenten, ohne Testlauf.
        run: bun run check:docs
      - name: Unit-Tests (und README-Zahl)
        # Führt `bun run test` aus und vergleicht die Zahl der bestandenen Tests
        # mit der Angabe im README-Schnellstart.
        run: node scripts/check-unit-count.mjs
      - name: Stub-Kontrakt und HTTP-Tests der Routen (Supabase und Stripe gestubbt)
        # Verkettet test:stub, test:routes, test:revoke, test:webhook, test:admin
        # und test:billing; die Einzelskripte bleiben für gezielte Läufe.
        run: bun run test:http
      - name: Mail-Vorlagen entsprechen der Marke
        run: bun run mail:check
      - name: Angebotszahlen gegen kalkulation.csv
        # angebot/ steht in .gitignore (kaufmaennische Daten bleiben lokal), in CI
        # fehlt die Kalkulationsbasis. Ohne CSV waere der Schritt immer rot.
        if: hashFiles('angebot/kalkulation.csv') != ''
        run: bun run verify:angebot
      - name: Build Dashboard
        run: |
          mkdir -p ci-logs
          bun run build 2>&1 | tee ci-logs/next-build.log
      - name: Startseite im Trockenlauf prüfen (ohne Auth-Konfiguration)
        # Der Build darüber hat keine NEXT_PUBLIC_*-Werte. Die Startseite muss
        # deshalb den Trockenlauf-Hinweis zeigen; `check:render:dry` hält die
        # Zahl der Prüfungen gegen die README.
        run: |
          set -euo pipefail
          (cd apps/dashboard && PORT=3100 nohup bun run start > /tmp/dryrun-server.log 2>&1 &)

          ready=0
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3100/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Server ist nicht gestartet:"
            cat /tmp/dryrun-server.log
            exit 1
          fi

          BASE_URL=http://127.0.0.1:3100 bun run check:render:dry
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: next-build-logs
          path: |
            ci-logs/
            apps/dashboard/.next/trace
          retention-days: 7
          if-no-files-found: warn

  database:
    name: IPAM & Registrierung (Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Vollständig gepinnt (Patch + Alpine-Version): ein gleitender Tag
        # könnte die DB-Suiten ohne Codeänderung rot machen.
        image: postgres:16.16-alpine3.24
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Datenbank-Tests (und README-Zahlen)
        # Führt die sieben Suiten über scripts/run-db-suites.mjs aus und
        # vergleicht die Prüfungszahlen mit dem test:db-Absatz der README.
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun run test:db
      - name: Postgres-Log sichern
        if: failure()
        run: |
          mkdir -p ci-logs
          docker logs "${{ job.services.postgres.id }}" > ci-logs/postgres.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: database-logs
          path: ci-logs/
          retention-days: 7
          if-no-files-found: warn

  auth:
    name: Auth-Route (lokaler Supabase-Stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"
      - name: Install
        run: bun install --frozen-lockfile
      - uses: ./.github/actions/supabase-local
      - name: Auth-Route gegen den Stack prüfen (und README-Zahl)
        env:
          DEFAULT_NODE_ID: ci-node-1
        run: |
          set -euo pipefail
          # SUPABASE_* kommen aus der Composite-Action `supabase-local`.
          mkdir -p ci-logs

          bun run build 2>&1 | tee ci-logs/next-build.log
          (cd apps/dashboard && PORT=3000 nohup bun run start > /tmp/dachvpn-server.log 2>&1 &)

          ready=0
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Server ist nicht gestartet:"
            cat /tmp/dachvpn-server.log
            exit 1
          fi

          BASE_URL=http://127.0.0.1:3000 bun run test:auth-route 2>&1 \
            | tee ci-logs/auth-route.log || {
            echo "Route-Log:"
            cat /tmp/dachvpn-server.log
            exit 1
          }
      # Läuft nur, wenn ein vorheriger Schritt fehlgeschlagen ist.
      - name: Logs einsammeln
        if: failure()
        run: |
          mkdir -p ci-logs
          cp /tmp/dachvpn-server.log ci-logs/ 2>/dev/null || true
          # Snapshot der Action nicht überschreiben; nur nachziehen, wenn er fehlt.
          [ -f ci-logs/supabase-status.txt ] || supabase status > ci-logs/supabase-status.txt 2>&1 || true
          docker ps > ci-logs/docker-ps.txt 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: auth-route-logs
          path: ci-logs/
          retention-days: 7
          if-no-files-found: warn

  dashboard-auth:
    name: Dashboard mit Supabase Auth (Rendering)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"
      - name: Install
        run: bun install --frozen-lockfile
      # Startet den Stack und exportiert SUPABASE_* und NEXT_PUBLIC_*; Next
      # inlined die NEXT_PUBLIC_*-Werte beim Build.
      - uses: ./.github/actions/supabase-local
      - name: Mit Auth-Konfiguration bauen und Startseite prüfen
        run: |
          set -euo pipefail
          # NEXT_PUBLIC_* kommen aus der Composite-Action `supabase-local`.
          mkdir -p ci-logs
          bun run build 2>&1 | tee ci-logs/next-build.log

          (cd apps/dashboard && PORT=3000 nohup bun run start > /tmp/dachvpn-server.log 2>&1 &)

          ready=0
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "FAIL Server ist nicht gestartet"
            cat /tmp/dachvpn-server.log
            exit 1
          fi

          # Prüft die sechs Render-Punkte und hält ihre Zahl gegen die README.
          # Das HTML landet als Artefakt in ci-logs/page.html.
          RENDER_PAGE_FILE=ci-logs/page.html bun run check:render
      - name: Logs einsammeln
        if: failure()
        run: |
          mkdir -p ci-logs
          cp /tmp/dachvpn-server.log ci-logs/ 2>/dev/null || true
          # Snapshot der Action nicht überschreiben; nur nachziehen, wenn er fehlt.
          [ -f ci-logs/supabase-status.txt ] || supabase status > ci-logs/supabase-status.txt 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: dashboard-auth-logs
          path: ci-logs/
          retention-days: 7
          if-no-files-found: warn
