name: CI-Wächter

# Meldet einen roten Lauf auf main als Issue, sobald er fertig ist: workflow_run
# reagiert auf das Ende von „CI“ und „Doku-Links“, der tägliche Cron bleibt als
# Netz für Läufe, die gar nicht erst starten (Abrechnungssperre) und für
# Änderungen an diesem Workflow selbst. Die Einordnung (Abrechnungssperre vs.
# Testfehler) steht im Issue, weil beide unterschiedlich zu beheben sind: bei
# einer Sperre startet kein Runner, dann ist kein Codefehler zu suchen.
#
# schedule und workflow_run laufen nur auf dem Default-Branch; auf
# Feature-Branches gibt es den Wächter deshalb nicht. workflow_dispatch dient
# dem manuellen Prüfen.
on:
  schedule:
    # 06:00 UTC, nach dem üblichen Tageslauf und vor dem Arbeitsbeginn in Europa.
    - cron: "0 6 * * *"
  workflow_run:
    # Namen wie in `name:` der beiden Workflows, nicht die Dateinamen.
    workflows: ["CI", "Doku-Links"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Für die Annotationen, aus denen die Abrechnungssperre hervorgeht.
  checks: read

concurrency:
  group: ci-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Roten Lauf auf main melden
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Kein bun install: das Skript nutzt nur Node-Bordmittel.
      - name: Prüfen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_WORKFLOWS: ci.yml,docs-links.yml
          CI_BRANCH: main
        run: node scripts/ci-watch.mjs
