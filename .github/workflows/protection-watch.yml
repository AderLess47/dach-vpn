name: Schutz-Wächter

# Meldet als Issue, wenn der Direkt-Push-Schutz auf main wegfällt: fehlende
# oder abgeschaltete Regeln des Repository-Rulesets (Pull-Request-Pflicht, die
# drei Pflicht-Checks, kein Force-Push, kein Löschen) oder eine abgeschaltete
# Admin-Durchsetzung der klassischen Regel. Hintergrund ist der versehentliche
# Direkt-Push a352fa8.
#
# Zwei Quellen mit unterschiedlichen Rechten:
# 1. `GET /rules/branches/main` ist öffentlich lesbar — die Ruleset-Regeln
#    werden ohne persönliches Token geprüft. Das ist die Ebene, die auch
#    Admins blockiert, weil die Bypass-Liste leer ist.
# 2. Die klassische Branch-Protection ist nur mit Adminrechten lesbar (ohne
#    Auth `401`), das `GITHUB_TOKEN` hat sie nie. Dafür liest der Wächter
#    `PROTECTION_WATCH_TOKEN` (Fine-grained PAT, nur dieses Repo,
#    „Administration: Read-only“); die Issues schreibt das `GITHUB_TOKEN`.
#    Fehlt es, bleibt nur `enforce_admins` ungeprüft und der Wächter sagt das
#    als Issue — still grün wäre schlimmer. Anlegen: Settings → Secrets and
#    variables → Actions.
#
# schedule und workflow_run laufen nur auf dem Default-Branch; auf
# Feature-Branches gibt es den Wächter deshalb nicht. workflow_dispatch dient
# dem manuellen Prüfen nach einer Änderung an den Repo-Einstellungen.
on:
  schedule:
    # 06:15 UTC, nach dem CI-Wächter um 06:00.
    - cron: "15 6 * * *"
  workflow_run:
    # Direkt nach dem CI-Lauf auf main, damit eine abgeschaltete Durchsetzung
    # nicht bis zum nächsten Morgen unbemerkt bleibt.
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: protection-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Admin-Durchsetzung auf main prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Kein bun install: das Skript nutzt nur Node-Bordmittel.
      - name: Prüfen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROTECTION_WATCH_TOKEN: ${{ secrets.PROTECTION_WATCH_TOKEN }}
          PROTECTION_BRANCH: main
          # Die Checks, die das Ruleset verlangt — hier gepflegt, damit eine
          # Umbenennung im Workflow sichtbar wird statt still zu verpuffen.
          PROTECTION_REQUIRED_CHECKS: |
            Typecheck, Tests, Build
            IPAM & Registrierung (Integration)
            Relative Links in docs/ und README.md
        run: node scripts/protection-watch.mjs
