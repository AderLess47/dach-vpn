name: Supabase lokal
description: >-
  Startet den Supabase-Lokalstack und stellt die Auth-Zugangsdaten als
  Umgebungsvariablen bereit (SUPABASE_* und NEXT_PUBLIC_*).

runs:
  using: composite
  steps:
    # Exakt pinnen: die Service-Images des lokalen Stacks (auch Postgres)
    # stecken im CLI-Binary, ein "latest" zieht sie unbemerkt mit und kann die
    # CI ohne Codeänderung rot machen. 3.2.0 bringt
    # public.ecr.aws/supabase/postgres:17.12.0.000 mit.
    - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      with:
        version: 3.2.0

    # `supabase start` spielt supabase/migrations beim ersten Start ein.
    #
    # Der Start bricht mit "address already in use" ab, wenn auf dem Runner
    # noch ein Container (oder dessen docker-proxy) einen der Stack-Ports hält
    # (54321 API, 54322 DB, 54324 Inbucket). Das ist ein Runner-Zustand, kein
    # Codefehler: Der Job ist dann rot, bevor ein Test gelaufen ist. Deshalb
    # vor dem Start aufräumen, den Start begrenzt wiederholen und beim letzten
    # Fehlschlag die Portbelegung protokollieren — sonst bleibt nur der
    # CLI-Text, der den Halter des Ports nicht nennt.
    - name: Stack starten
      shell: bash
      run: |
        set -euo pipefail

        # Nur die Container dieses Projekts (project_id = dachvpn) entfernen:
        # `supabase stop` allein erwischt einen halb gestarteten Stack nicht
        # immer, und ein übrig gebliebener docker-proxy hält den Port weiter.
        cleanup() {
          supabase stop --no-backup >/dev/null 2>&1 || true
          docker ps -aq --filter "name=_dachvpn" | xargs -r docker rm -f >/dev/null 2>&1 || true
        }

        cleanup
        started=0
        for attempt in 1 2 3; do
          if supabase start; then
            started=1
            break
          fi
          echo "::warning::supabase start fehlgeschlagen (Versuch $attempt von 3) — Stack aufräumen und erneut versuchen."
          cleanup
          sleep $((attempt * 3))
        done

        if [ "$started" != "1" ]; then
          echo "::error::supabase start ist dreimal fehlgeschlagen."
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          ss -ltnp 2>/dev/null | grep -E ':(54321|54322|54324)\b' \
            || echo "Kein Listener auf 54321/54322/54324."
          exit 1
        fi

    # Das Postgres-Image lässt sich nicht in config.toml setzen; es kommt aus
    # dem CLI-Binary. Der Pin oben hält es fest, diese Prüfung macht eine
    # Abweichung sichtbar, statt sie stillschweigend mitzuziehen.
    - name: Postgres-Image prüfen
      shell: bash
      run: |
        set -euo pipefail
        expected="supabase/postgres:17.12.0.000"
        db_image=$(docker ps --format '{{.Names}} {{.Image}}' | awk '$1 ~ /^supabase_db_/ {print $2; exit}')
        if [ -z "$db_image" ]; then
          echo "::error::Kein laufender Container supabase_db_* gefunden."
          docker ps --format 'table {{.Names}}\t{{.Image}}'
          exit 1
        fi
        case "$db_image" in
          *"$expected") echo "Postgres-Image gepinnt: $db_image" ;;
          *)
            echo "::error::Postgres-Image ist $db_image, erwartet $expected"
            exit 1
            ;;
        esac

    # Die Werte landen in $GITHUB_ENV, damit spätere Schritte sie ohne erneutes
    # `eval` sehen. Die Anführungszeichen aus `supabase status -o env` müssen
    # weg, sonst stehen sie im Wert.
    - name: Zugangsdaten exportieren
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ci-logs
        supabase status -o env > ci-logs/supabase-status.txt
        sed -E 's/^([A-Za-z0-9_]+)="(.*)"$/\1=\2/' ci-logs/supabase-status.txt >> "$GITHUB_ENV"

        read_value() {
          sed -nE "s/^$1=\"?([^\"]*)\"?$/\1/p" ci-logs/supabase-status.txt | head -n1
        }

        # Ältere CLI-Versionen geben API_URL ohne Schema aus.
        api_url=$(read_value API_URL)
        case "$api_url" in
          http*) ;;
          *) api_url="http://$api_url" ;;
        esac

        anon_key=$(read_value ANON_KEY)
        service_key=$(read_value SERVICE_ROLE_KEY)

        {
          echo "SUPABASE_URL=$api_url"
          echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
          echo "SUPABASE_ANON_KEY=$anon_key"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_key"
        } >> "$GITHUB_ENV"
