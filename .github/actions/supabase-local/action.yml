name: Supabase lokal
description: >-
  Startet den Supabase-Lokalstack und stellt die Auth-Zugangsdaten als
  Umgebungsvariablen bereit (SUPABASE_* und NEXT_PUBLIC_*).

runs:
  using: composite
  steps:
    # Exakt pinnen: die Service-Images des lokalen Stacks (auch Postgres)
    # stecken im CLI-Binary, ein "latest" zieht sie unbemerkt mit und kann die
    # CI ohne Codeänderung rot machen. 3.2.0 bringt
    # public.ecr.aws/supabase/postgres:17.12.0.000 mit.
    - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      with:
        version: 3.2.0

    # `supabase start` spielt supabase/migrations beim ersten Start ein.
    #
    # Der Start bricht mit "address already in use" ab, wenn auf dem Runner
    # noch ein Container (oder dessen docker-proxy) einen der Stack-Ports hält
    # (54321 API, 54322 DB, 54324 Inbucket). Das ist ein Runner-Zustand, kein
    # Codefehler: Der Job ist dann rot, bevor ein Test gelaufen ist. Deshalb
    # vor jedem Versuch protokollieren, wer die Ports hält, dann aufräumen und
    # den Start begrenzt wiederholen. Aufgeräumt werden nicht nur eigene
    # Reste, sondern auch fremde Container auf diesen Ports: gehört der Halter
    # nicht zum Projekt, hätte der Retry sonst nichts frei gemacht.
    - name: Stack starten
      shell: bash
      run: |
        set -euo pipefail

        stack_ports=(54321 54322 54324)

        # Listener samt Prozess. Ohne root nennt `ss` den Prozess nicht; auf
        # GitHub-Runnern gibt es passwortloses sudo, sonst bleibt der Eintrag
        # ohne PID, und der Container-Teil unten trägt die Information.
        listeners() {
          if sudo -n true >/dev/null 2>&1; then
            sudo -n ss -ltnp 2>/dev/null || true
          else
            ss -ltnp 2>/dev/null || true
          fi
        }

        # Container mit Portabbildung auf einen Stack-Port — erkannt an
        # ":<port>->" im Ports-Feld und damit unabhängig vom Projektnamen.
        mapped_containers() {
          { docker ps --format '{{.ID}} {{.Names}} {{.Ports}}' 2>/dev/null || true; } \
            | awk -v p=":$1->" 'index($0, p)'
        }

        # Laufende Container im Host-Netzwerk. Sie veröffentlichen keine
        # Ports: ihr Listener liegt direkt auf dem Host und taucht im
        # Ports-Feld von `docker ps` nicht auf.
        host_network_containers() {
          docker ps --filter network=host --format '{{.ID}} {{.Names}}' 2>/dev/null || true
        }

        # Container-ID zu einer Listener-PID. /proc/<pid>/cgroup nennt sie bei
        # den üblichen Runtimes; ohne passwortloses sudo liefert `ss` keine
        # PID, dann bleibt das Ergebnis leer.
        container_of_pid() {
          [ -n "${1:-}" ] || return 0
          { cat "/proc/$1/cgroup" 2>/dev/null || true; } \
            | grep -oE '[0-9a-f]{64}' | head -n1 || true
        }

        # PIDs der Listener eines Ports aus `ss -ltnp`
        # ("users:((\"ss\",pid=42,fd=4))"); leer, wenn `ss` keine PID nennt.
        listener_pids() {
          listeners | grep -E ":$1([^0-9]|$)" \
            | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u || true
        }

        # Host-Netzwerk-Container, die den Port halten. Erste Wahl ist die
        # Zuordnung über die PID des Host-Listeners; gibt es keine PID (kein
        # sudo), wird im Container selbst nach dem Listener gesucht.
        host_network_port_containers() {
          local port="$1" hosts pid cid id held=""
          hosts=$(host_network_containers)
          [ -n "$hosts" ] || return 0
          for pid in $(listener_pids "$port"); do
            cid=$(container_of_pid "$pid")
            [ -n "$cid" ] || continue
            held+=$(printf '%s\n' "$hosts" | awk -v id="${cid:0:12}" 'index($1, id)')$'\n'
          done
          if [ -z "$held" ]; then
            while read -r id _; do
              [ -n "$id" ] || continue
              if docker exec "$id" sh -c 'ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null' 2>/dev/null \
                | grep -E ":${port}([^0-9]|$)" >/dev/null; then
                held+=$(printf '%s\n' "$hosts" | awk -v id="$id" 'index($1, id)')$'\n'
              fi
            done <<< "$hosts"
          fi
          printf '%s' "$held" | awk 'NF' | sort -u
        }

        # Alle Container, die einen Stack-Port halten: per Portabbildung oder
        # über das Host-Netzwerk. Ausgabe je Zeile "ID Name [Ports]".
        port_containers() {
          mapped_containers "$1"
          host_network_port_containers "$1"
        }

        # Vor dem Aufräumen protokollieren, wer die Ports hält: sonst bleibt
        # beim Fehlschlag nur der CLI-Text, der den Halter nicht nennt.
        report_port_holders() {
          local port found mapped hostnet
          echo "::group::Portbelegung vor dem Aufräumen"
          for port in "${stack_ports[@]}"; do
            echo "— Port $port —"
            found=$(listeners | grep -E ":${port}([^0-9]|$)" || true)
            if [ -n "$found" ]; then echo "$found"; else echo "  kein Listener"; fi
            mapped=$(mapped_containers "$port")
            hostnet=$(host_network_port_containers "$port")
            if [ -n "$mapped" ]; then echo "$mapped"; fi
            if [ -n "$hostnet" ]; then
              echo "  Host-Netzwerk (ohne Portabbildung):"
              printf '%s\n' "$hostnet" | sed 's/^/    /'
            fi
            if [ -z "$mapped" ] && [ -z "$hostnet" ]; then echo "  kein Container"; fi
          done
          echo "::endgroup::"
        }

        cleanup() {
          report_port_holders

          supabase stop --no-backup >/dev/null 2>&1 || true

          # Eigene Reste (project_id = dachvpn): `supabase stop` erwischt einen
          # halb gestarteten Stack nicht immer, und ein übrig gebliebener
          # docker-proxy hält den Port weiter.
          docker ps -aq --filter "name=_dachvpn" | xargs -r docker rm -f >/dev/null 2>&1 || true

          # Fremde Container auf den Stack-Ports, auch solche im
          # Host-Netzwerk ohne Portabbildung. Der Runner gehört dem Job; ein
          # fremder Container ist hier ein Rest eines früheren Laufs auf einem
          # wiederverwendeten Runner und sonst nicht zu beseitigen.
          local ids
          ids=$(for port in "${stack_ports[@]}"; do port_containers "$port"; done \
            | awk '{print $1}' | sort -u)
          if [ -n "$ids" ]; then
            echo "Entferne Container auf den Stack-Ports:"
            echo "$ids" | xargs docker rm -f || true
          fi
        }

        cleanup
        started=0
        for attempt in 1 2 3; do
          if supabase start; then
            started=1
            break
          fi
          echo "::warning::supabase start fehlgeschlagen (Versuch $attempt von 3) — Stack aufräumen und erneut versuchen."
          cleanup
          sleep $((attempt * 3))
        done

        if [ "$started" != "1" ]; then
          echo "::error::supabase start ist dreimal fehlgeschlagen."
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          echo "Container im Host-Netzwerk (ohne Portabbildung):"
          host_network_containers || true
          listeners | grep -E ':(54321|54322|54324)([^0-9]|$)' \
            || echo "Kein Listener auf 54321/54322/54324."
          exit 1
        fi

    # Das Postgres-Image lässt sich nicht in config.toml setzen; es kommt aus
    # dem CLI-Binary. Der Pin oben hält es fest, diese Prüfung macht eine
    # Abweichung sichtbar, statt sie stillschweigend mitzuziehen.
    - name: Postgres-Image prüfen
      shell: bash
      run: |
        set -euo pipefail
        expected="supabase/postgres:17.12.0.000"
        db_image=$(docker ps --format '{{.Names}} {{.Image}}' | awk '$1 ~ /^supabase_db_/ {print $2; exit}')
        if [ -z "$db_image" ]; then
          echo "::error::Kein laufender Container supabase_db_* gefunden."
          docker ps --format 'table {{.Names}}\t{{.Image}}'
          exit 1
        fi
        case "$db_image" in
          *"$expected") echo "Postgres-Image gepinnt: $db_image" ;;
          *)
            echo "::error::Postgres-Image ist $db_image, erwartet $expected"
            exit 1
            ;;
        esac

    # Die Werte landen in $GITHUB_ENV, damit spätere Schritte sie ohne erneutes
    # `eval` sehen. Die Anführungszeichen aus `supabase status -o env` müssen
    # weg, sonst stehen sie im Wert.
    - name: Zugangsdaten exportieren
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ci-logs
        supabase status -o env > ci-logs/supabase-status.txt
        sed -E 's/^([A-Za-z0-9_]+)="(.*)"$/\1=\2/' ci-logs/supabase-status.txt >> "$GITHUB_ENV"

        read_value() {
          sed -nE "s/^$1=\"?([^\"]*)\"?$/\1/p" ci-logs/supabase-status.txt | head -n1
        }

        # Ältere CLI-Versionen geben API_URL ohne Schema aus.
        api_url=$(read_value API_URL)
        case "$api_url" in
          http*) ;;
          *) api_url="http://$api_url" ;;
        esac

        anon_key=$(read_value ANON_KEY)
        service_key=$(read_value SERVICE_ROLE_KEY)

        {
          echo "SUPABASE_URL=$api_url"
          echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
          echo "SUPABASE_ANON_KEY=$anon_key"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_key"
        } >> "$GITHUB_ENV"
